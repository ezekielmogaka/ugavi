name: Ugavi CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ugavi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ERPNEXT_TAG: v16.55.0
  UGAVI_IMAGE: ugavi
  UGAVI_TAG: ci-${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: pip install ruff==0.14.6
      - name: Python lint
        run: ruff check ugavi/
      - name: Configuration validation
        run: |
          python3 deploy/validate_tenant_manifest.py deploy/tenants.example.json
          python3 -c "import json; a=json.load(open('apps.json')); assert a['frappe']['branch']=='v16.56.0'; assert a['erpnext']['branch']=='v16.55.0'; assert a['solvronix_desk']['branch']=='v3.2.0'"
      - name: Shell syntax
        run: bash -n deploy/docker/entrypoint.sh

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ugavi:ci-${{ github.sha }}
          cache-from: type=gha,scope=ugavi
          cache-to: type=gha,mode=max,scope=ugavi
          build-args: |
            ERPNEXT_TAG=${{ env.ERPNEXT_TAG }}
            UGAVI_VERSION=ci-${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
            SOLVRONIX_TAG=v3.2.0
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ugavi:ci-${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Start infrastructure
        run: |
          docker compose up -d mariadb valkey mailpit
          docker compose rm -sf configurator
          docker compose up -d configurator
          docker compose up -d backend websocket frontend scheduler queue-default queue-long
      - name: Wait for Frappe health
        run: |
          for _ in $(seq 1 72); do
            curl -fsS http://localhost:8080/api/method/frappe.ping && exit 0
            sleep 5
          done
          docker compose logs --no-color --tail=200
          exit 1
      - name: Migrate and seed isolated CI site
        run: |
          docker compose exec -T backend bench --site ugavi.localhost migrate
          docker compose exec -T backend bench --site ugavi.localhost execute ugavi.scripts.setup_config.run
          docker compose exec -T backend bench --site ugavi.localhost set-config developer_mode 1
          docker compose exec -T backend bench --site ugavi.localhost execute ugavi.scripts.seed_lokado.run
      - name: Backend and domain gates
        run: |
          docker compose exec -T backend bench --site ugavi.localhost set-config allow_tests true
          docker compose exec -T backend bench --site ugavi.localhost run-tests --app ugavi
          docker compose exec -T backend bench --site ugavi.localhost execute ugavi.scripts.check_lokado_demo.run
          docker compose exec -T backend bench --site ugavi.localhost execute ugavi.scripts.check_fleet_demo.run
          docker compose exec -T backend bench --site ugavi.localhost execute ugavi.scripts.check_upstream_compatibility.run
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Browser smoke
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ugavi-ci-evidence-${{ github.sha }}
          path: tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ugavi-ci-containers-${{ github.sha }}
          path: docker-compose.log
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
