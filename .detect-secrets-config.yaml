# .detect-secrets config — secret scanning (GA-041)
# Run: make security-scan (or: detect-secrets scan --all-files ugavi/)

secrets:
  # Files to exclude from scanning
  exclude:
    - ".*\\.test\\..*"
    - ".*test_.*\\.py"
    - ".*\\.min\\.js"
    - "node_modules/.*"
    - ".*\\.lock"
    - ".*\\.svg"
    - "tests/fixtures/.*"

  # Plugins to use
  plugins:
    - name: AWSKeyDetector
    - name: ArtifactoryDetector
    - name: Base64HighEntropyString
      limit: 4.5
    - name: BasicAuthDetector
    - name: CloudantDetector
    - name: GitHubTokenDetector
    - name: HexHighEntropyString
      limit: 3.0
    - name: JwtTokenDetector
    - name: KeywordDetector
    - name: MailchimpDetector
    - name: NpmDetector
    - name: PrivateKeyDetector
    - name: SlackDetector
    - name: StripeDetector
    - name: TwilioDetector

# Baseline: known false positives (generated after first scan)
# Run: detect-secrets scan --all-files ugavi/ > .secrets.baseline
# Then: cat .secrets.baseline | detect-secrets audit