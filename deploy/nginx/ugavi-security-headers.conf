# Nginx configuration for Ugavi — Security Headers (GA-043)
# Place at: /etc/nginx/sites-available/ugavi or
# include in frappe-bench nginx template

server {
    listen 443 ssl http2;
    server_name ugavi.example.com;

    # TLS 1.2 minimum, prefer 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security Headers ---
    # HSTS: enforce HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Permissions policy (disable unused features)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Cross-origin isolation (for SharedArrayBuffer if needed)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Cache control for sensitive pages
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # Remove server version banner
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limit zone (10 requests/second per IP)
        limit_req zone=ugavi_limit burst=20 nodelay;
        limit_req_status 429;
    }

    # API rate limiting
    location /api/ {
        limit_req zone=ugavi_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File uploads: max 20MB
    client_max_body_size 20M;

    # Logs (JSON structured for SIEM integration)
    access_log /var/log/nginx/ugavi_access.log json;
    error_log /var/log/nginx/ugavi_error.log warn;
}

# Rate limit zones (defined in http block)
# limit_req_zone $binary_remote_addr zone=ugavi_limit:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=ugavi_api:10m rate=5r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ugavi.example.com;
    return 301 https://$host$request_uri;
}

