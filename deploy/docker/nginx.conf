# Nginx reverse proxy for Ugavi
# Serves static assets directly; proxies everything else to gunicorn

server {
    listen 8080;
    server_name ugavi.localhost;

    # Increase upload size
    client_max_body_size 50m;

    # Serve static assets directly from filesystem
    location /assets/ {
        alias /home/frappe/frappe-bench/sites/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to gunicorn
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support for real-time events
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}