[project]
name = "ugavi"
version = "0.1.0"
description = "Enterprise Supply Chain Management for ERPNext"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ugavi Team"}
]
keywords = ["erpnext", "frappe", "supply-chain", "procurement", "logistics"]
dependencies = [
    "cryptography>=41.0.0",
    "python-jose>=3.3.0",
    "qrcode>=7.4.0",
    "python-barcode>=0.15.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
    "playwright>=1.40.0",
]

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"